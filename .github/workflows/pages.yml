# GitHub Pages へそのまま配信する（ビルド不要の HTML / JS）。
# リポジトリの Settings → Pages → Source を「GitHub Actions」にしておくこと。
name: Deploy to GitHub Pages

# 公開は main だけから行う（作業ブランチへのプッシュで動かすと、同じ「pages」の枠で
# main の公開が取り消されてしまうため）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 配信するファイルだけをまとめる
        run: |
          mkdir -p _site
          cp -r index.html play.html css js fonts .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
